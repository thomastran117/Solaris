# ── Database: H2 in-memory (MySQL-compat mode) ───────────────────────────────
# Avoids Docker dependency on Windows. AppDatabase reads app.database.* via
# EnvironmentSetting, so we override those keys (not spring.datasource.*).
app.database.url=jdbc:h2:mem:shopwave_it;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
app.database.username=sa
app.database.password=
app.database.driver-class-name=org.h2.Driver
app.database.maximum-pool-size=5
app.database.minimum-idle=1
app.database.connection-timeout=30000
app.database.idle-timeout=600000
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# Hibernate 6 maps Instant → TIMESTAMP WITH TIME ZONE by default; H2 in MySQL
# mode doesn't support that syntax. NORMALIZE uses plain TIMESTAMP instead.
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE
# Continue past DROP TABLE errors (tables don't exist yet on first run in H2)
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false
# Defer repository init — auth tests never touch non-auth repos, so any query
# validation errors in those repos simply never fire.
spring.data.jpa.repositories.bootstrap-mode=lazy
# ── Risk engine ───────────────────────────────────────────────────────────────
# vip-segment-id defaults to -1 in production (sentinel = no VIP segment configured),
# but RiskProperties binds it as UUID. Provide a nil UUID so the context starts cleanly.
app.risk.vip-segment-id=00000000-0000-0000-0000-000000000000

# ── JWT ───────────────────────────────────────────────────────────────────────
# 64-byte Base64-encoded test secret. DO NOT use in production.
app.security.jwt.secret=dGVzdC1zZWNyZXQtZm9yLWludGVncmF0aW9uLXRlc3RzLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uIQ==
app.security.jwt.access-token-ttl-seconds=900
app.security.jwt.refresh-token-ttl-seconds=604800
app.security.jwt.issuer=shopwave-test

# ── Redis ─────────────────────────────────────────────────────────────────────
# AbstractIntegrationIT overrides app.redis.host and app.redis.port via @DynamicPropertySource
app.redis.password=
app.redis.database=0
app.redis.timeout=2000

# ── Kafka ─────────────────────────────────────────────────────────────────────
# Auth emits no Kafka events. Disable listeners; point producer at a non-existent
# broker so the app context starts even if Kafka auto-config is active.
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.listener.auto-startup=false
spring.kafka.producer.properties.max.block.ms=200
spring.kafka.producer.properties.delivery.timeout.ms=500

# ── Mail ──────────────────────────────────────────────────────────────────────
# JavaMailSender is @MockBean'd in AbstractIntegrationIT; these prevent binding errors.
spring.mail.host=localhost
spring.mail.port=25

# ── Cookie ────────────────────────────────────────────────────────────────────
app.security.cookie.secure=false
app.security.cookie.same-site=Lax

# ── Device check ──────────────────────────────────────────────────────────────
# Device recognition relies on BINARY(16) UUID comparisons that H2 handles
# differently from MySQL. Disable to test core auth flows without device gating.
app.security.device-check.enabled=false

# ── Elasticsearch ─────────────────────────────────────────────────────────────
# ElasticsearchClient is @MockitoBean'd. Exclude the data auto-config so Spring
# doesn't try to build ElasticsearchTemplate from the mock client (which has a
# null transport). The three ES repositories are also @MockitoBean'd in the base class.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration
app.elasticsearch.host=localhost
app.elasticsearch.port=9200
app.elasticsearch.scheme=http
app.elasticsearch.api-key=
app.elasticsearch.username=
app.elasticsearch.password=

# ── Stripe ────────────────────────────────────────────────────────────────────
# SDK initialises statically; no calls are made during auth flows.
app.stripe.secret-key=sk_test_dummy
app.stripe.publishable-key=pk_test_dummy
app.stripe.webhook-secret=whsec_dummy

# ── AWS S3 ────────────────────────────────────────────────────────────────────
# S3Client is @MockBean'd; these prevent binding errors.
app.s3.region=us-east-1
app.s3.bucket=test-bucket
app.s3.access-key=dummy-key
app.s3.secret-key=dummy-secret
app.s3.public-url-base=http://localhost/s3

# ── Misc ──────────────────────────────────────────────────────────────────────
# Suppress Hikari startup chatter in test output
logging.level.com.zaxxer.hikari=WARN
logging.level.org.testcontainers=WARN
