name: Issue naming and labeler

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize title and apply form labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // GitHub assigns issue numbers only after creation; normalize titles here.
            // Format: [<issue number>] <type>: <imperative summary>.
            const typedTitle = issue.title.trim().match(/^(?:\[(\d+)\]\s*)?(epic|feat|bug|fix|docs|test|ci|chore|refactor|perf):\s*(.+)$/i);
            const legacyTitle = issue.title.trim().match(/^\[(Feature|Bug)\]:\s*(.+)$/i);
            const kind = typedTitle?.[2]?.toLowerCase()
              ?? (legacyTitle?.[1]?.toLowerCase() === "bug" || issue.labels.some(l => l.name.toLowerCase() === "bug") ? "bug" : "feat");
            const summary = (typedTitle?.[3] ?? legacyTitle?.[2] ?? issue.title.trim().replace(/^\[\d+\]\s*/, "")).trim();
            const normalizedTitle = `[${issue.number}] ${kind}: ${summary}`;
            if (summary && issue.title !== normalizedTitle) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, title: normalizedTitle });
            }


            const managedLabels = [
              "priority:high",
              "priority:medium",
              "priority:low",
              "complexity:high",
              "complexity:medium",
              "complexity:low",
              "frontend",
              "backend"
            ];

            function fieldValue(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(`### ${escaped}\\s+([\\s\\S]*?)(?=\\n### |$)`, "i");
              const match = issue.body?.match(pattern);
              return match?.[1]?.trim() ?? "";
            }

            const nextLabels = new Set();
            const priority = fieldValue("Priority");
            const complexity = fieldValue("Complexity");
            const domain = fieldValue("Affected domain").toLowerCase();

            if (!priority && !complexity && !domain) {
              core.info("No managed issue-form fields found. Skipping label sync.");
              return;
            }

            if (managedLabels.includes(priority)) {
              nextLabels.add(priority);
            }

            if (managedLabels.includes(complexity)) {
              nextLabels.add(complexity);
            }

            if (domain === "frontend" || domain === "both") {
              nextLabels.add("frontend");
            }

            if (domain === "backend" || domain === "both") {
              nextLabels.add("backend");
            }

            const labelsToRemove = issue.labels
              .map((label) => label.name)
              .filter((label) => managedLabels.includes(label) && !nextLabels.has(label));

            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue.number,
                name: label
              });
            }

            if (nextLabels.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [...nextLabels]
              });
            }
