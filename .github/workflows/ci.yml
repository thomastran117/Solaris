name: CI

# Runs on a push to any branch, not just main, so feature branches get CI before a PR
# exists — and so a PR whose head fails to sync (a push ref-lock race leaves the branch
# updated but fires no `synchronize` event) is still covered by the push run.
#
# `pull_request` is limited to opened/reopened deliberately. The default type list
# includes `synchronize`, which would fire on every push to an open PR branch and run
# the whole 8-shard matrix a second time for the same commit.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, reopened]

# Keyed on the PR number when there is one, so a pull_request run and a push run for the
# same PR collapse into a single group instead of racing as two independent runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run unit tests with coverage gate
        run: ./mvnw verify -Dtest="**/*Test" -Dspring-boot.repackage.skip=true --batch-mode

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  backend-integration-tests:
    name: Backend Integration Tests ${{ matrix.shard }}/8 (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # One PostgreSQL per shard job. Surefire runs with -DreuseForks=false (a JVM per
    # test class, executed sequentially), so a single shared database is safe, and
    # sourcing it here avoids paying a Testcontainers start in each of those forks.
    # IntegrationContainers skips its own container when SHOPWAVE_TEST_DB_URL is set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopwave_it
          POSTGRES_USER: shopwave
          POSTGRES_PASSWORD: shopwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopwave -d shopwave_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            name: products-auth
            tests: ProductSubResourcesIT,ProductIT,InventoryIT,RestockIT,PurchaseOrderIT,InventoryTransferIT,AuthTokenIT,AuthRefreshIT,AuthOAuthIT,AuthSignupIT,AuthLoginIT,AuthDeviceIT,MfaIT
          - shard: 2
            name: products-extra
            tests: BundleIT,ProductQAIT,ProductBatchIT,ReviewIT,PromotionRuleIT,KitIT,PriceWatchIT,UploadIT,PricingIT,GiftCardIT,PremiumIT,UserPreferenceIT
          - shard: 3
            name: marketplace-catalog
            tests: MarketplaceAnalyticsIT,MarketplaceCatalogControllerIT,ProductComparisonIT,MarketplaceIT,MarketplaceCollectionIT,CommissionPolicyIT,CollectionIT,ImportIT
          - shard: 4
            name: orders-fulfillment
            tests: SubOrderIT,OrderIssueIT,CompanyOrderIT,OrderIT,DeliverySlotIT,TrackingWebhookIT,OrderSseIT,OrderStatusHistoryIT,DeliveryWebSocketIT,LocationInventoryIT,StockNotificationIT,MarketplaceAvailabilityIT,SearchSuggestionIT,DeviceTokenIT
          - shard: 5
            name: vendors-company
            tests: VendorOnboardingIT,VendorPayoutIT,VendorAnalyticsIT,CompanyIT,TeamIT,AnnouncementIT,CompanyFollowIT,CompanyCatalogControllerIT,ProfileIT,CompanyWebhookIT
          - shard: 6
            name: customers-admin-analytics
            tests: CustomerSegmentIT,CustomerCreditIT,CustomerAddressIT,CustomerFeedIT,AnalyticsControllerIT,ForecastingControllerIT,OperationsIT,AdminReportControllerIT,AdminFeedbackIT,ReviewAdminIT,UserAdminIT,SearchAdminIT,PricingReportControllerIT,ReportIT
          - shard: 7
            name: subscriptions-returns-support
            tests: SavedListIT,LoyaltyIT,CouponIT,SubscriptionIT,CompanyReturnLocationIT,CompanyReturnIT,ReturnIT,SupportTicketIT,InternalNoteIT,FeedbackIT
          - shard: 8
            name: marketing-workflows
            tests: MarketingWorkflowIT,WorkflowEnrollmentIT,B2BQuoteIT,ShippingRateIT,TaxRateIT,DisputeIT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run integration tests
        env:
          SHOPWAVE_TEST_DB_URL: jdbc:postgresql://localhost:5432/shopwave_it
          SHOPWAVE_TEST_DB_USERNAME: shopwave
          SHOPWAVE_TEST_DB_PASSWORD: shopwave
        run: >-
          ./mvnw test -Dtest=${{ matrix.tests }}
          -DreuseForks=false
          -Dsurefire.timeout=240
          -Dsurefire.rerunFailingTestsCount=1
          -Djacoco.skip=true
          --batch-mode

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run
