name: CI

# `push` covers any branch, so a feature branch gets CI before a PR exists, and a commit is
# still built if the PR event is delayed or dropped.
#
# `pull_request` keeps its default types (opened, synchronize, reopened). `synchronize` is
# required, not redundant: `push` events fire in the fork for a fork-based PR, never here, so
# dropping it would leave a fork PR with no CI on every commit after the first.
#
# The cost is that a same-repo PR branch runs twice per push — once via `push`, once via
# `synchronize`. Accepted deliberately in exchange for fork coverage and for not depending on a
# single event type; the concurrency group below caps the waste to one in-flight run per branch,
# but it does not deduplicate the two events (they carry different `github.ref` values).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# `github.ref` is the branch for a push and `refs/pull/N/merge` for a pull_request, so this
# collapses repeated pushes to the same branch — superseded runs are cancelled — but a push and
# its matching pull_request run are in different groups and both execute.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run unit tests with coverage gate
        run: ./mvnw verify -Dtest="**/*Test" -Dspring-boot.repackage.skip=true --batch-mode

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  backend-integration-tests:
    name: Backend Integration Tests ${{ matrix.shard }}/8 (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # One PostgreSQL per shard job. Surefire runs with -DreuseForks=false (a JVM per
    # test class, executed sequentially), so a single shared database is safe, and
    # sourcing it here avoids paying a Testcontainers start in each of those forks.
    # IntegrationContainers skips its own container when SHOPWAVE_TEST_DB_URL is set.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shopwave_it
          POSTGRES_USER: shopwave
          POSTGRES_PASSWORD: shopwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopwave -d shopwave_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            name: products-auth
            tests: ProductSubResourcesIT,ProductIT,InventoryIT,RestockIT,PurchaseOrderIT,InventoryTransferIT,AuthTokenIT,AuthRefreshIT,AuthOAuthIT,AuthSignupIT,AuthLoginIT,AuthDeviceIT,MfaIT
          - shard: 2
            name: products-extra
            tests: BundleIT,ProductQAIT,ProductBatchIT,ReviewIT,PromotionRuleIT,KitIT,PriceWatchIT,UploadIT,PricingIT,GiftCardIT,PremiumIT,UserPreferenceIT
          - shard: 3
            name: marketplace-catalog
            tests: MarketplaceAnalyticsIT,MarketplaceCatalogControllerIT,ProductComparisonIT,MarketplaceIT,MarketplaceCollectionIT,CommissionPolicyIT,CollectionIT,ImportIT
          - shard: 4
            name: orders-fulfillment
            tests: SubOrderIT,OrderIssueIT,CompanyOrderIT,OrderIT,DeliverySlotIT,TrackingWebhookIT,OrderSseIT,OrderStatusHistoryIT,DeliveryWebSocketIT,LocationInventoryIT,StockNotificationIT,MarketplaceAvailabilityIT,SearchSuggestionIT,DeviceTokenIT
          - shard: 5
            name: vendors-company
            tests: VendorOnboardingIT,VendorPayoutIT,VendorAnalyticsIT,CompanyIT,TeamIT,AnnouncementIT,CompanyFollowIT,CompanyCatalogControllerIT,CompanyCatalogSearchIT,ProfileIT,CompanyWebhookIT
          - shard: 6
            name: customers-admin-analytics
            tests: CustomerSegmentIT,CustomerCreditIT,CustomerAddressIT,CustomerFeedIT,AnalyticsControllerIT,ForecastingControllerIT,OperationsIT,AdminReportControllerIT,AdminFeedbackIT,ReviewAdminIT,UserAdminIT,SearchAdminIT,PricingReportControllerIT,ReportIT
          - shard: 7
            name: subscriptions-returns-support
            tests: SavedListIT,LoyaltyIT,CouponIT,SubscriptionIT,CompanyReturnLocationIT,CompanyReturnIT,ReturnIT,SupportTicketIT,InternalNoteIT,FeedbackIT
          - shard: 8
            name: marketing-workflows
            tests: MarketingWorkflowIT,WorkflowEnrollmentIT,B2BQuoteIT,ShippingRateIT,TaxRateIT,DisputeIT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run integration tests
        env:
          SHOPWAVE_TEST_DB_URL: jdbc:postgresql://localhost:5432/shopwave_it
          SHOPWAVE_TEST_DB_USERNAME: shopwave
          SHOPWAVE_TEST_DB_PASSWORD: shopwave
        run: >-
          ./mvnw test -Dtest=${{ matrix.tests }}
          -DreuseForks=false
          -Dsurefire.timeout=240
          -Dsurefire.rerunFailingTestsCount=1
          -Djacoco.skip=true
          --batch-mode

  frontend-tests:
    name: Frontend Checks (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generates next-env.d.ts and the route types used by PageProps<...>.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      # Prettier is not enforced yet: most of the tree predates the formatter config
      # (see documentation/testing.md). Re-enable `npm run format:check` here once the
      # one-off repository-wide format lands.

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  frontend-smoke:
    name: Frontend Smoke Tests (standalone server + Playwright)
    needs: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The standalone server talks to playwright/stub_api.py instead of the real
      # backend: storefront fixtures plus a minimal session flow.
      API_INTERNAL_URL: http://127.0.0.1:8090
      DEFAULT_MARKETPLACE_ID: 11111111-1111-1111-1111-111111111111
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: playwright/requirements.txt

      - name: Install Playwright
        run: |
          python -m pip install -r playwright/requirements.txt
          python -m playwright install --with-deps chromium

      # Started before the build: pages prerendered at build time fetch from it.
      - name: Start stub API
        run: |
          nohup python playwright/stub_api.py 8090 > stub-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8090/api/health && break; sleep 1; done

      - name: Install and build the standalone server
        working-directory: frontend
        run: |
          npm ci
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Start the standalone server
        working-directory: frontend/.next/standalone
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > ../../../next-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/healthz && break; sleep 1; done

      - name: Run Playwright smoke tests
        run: python -m pytest playwright -v -p no:cacheprovider

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-logs
          path: |
            next-server.log
            stub-api.log
            playwright/stub_api_requests.log
