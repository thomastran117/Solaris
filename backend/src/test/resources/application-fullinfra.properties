# ── Full-infrastructure integration-test overlay ─────────────────────────────
# Layered ON TOP of application-integration-test.properties via
#   @ActiveProfiles({"integration-test", "fullinfra"})
# so the later (fullinfra) profile wins. It flips the pieces the base profile
# stubbed out — real Elasticsearch + real Kafka — for the small set of tests that
# extend AbstractSearchKafkaIT. Container hosts/ports are injected there via
# @DynamicPropertySource; everything else is inherited from the base profiles.

# ── Elasticsearch: real ────────────────────────────────────────────────────────
# Re-enable Spring Data Elasticsearch auto-config (the base profile excluded it so
# the mocked client wouldn't build a template). Keep only the mail-health exclusion.
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.mail.MailHealthContributorAutoConfiguration
# The search indices are pre-created (with the custom analyzers) by AbstractSearchKafkaIT
# before the context starts, so the Spring Data ES repositories find them already present
# and skip their own mappings-only auto-create (which can't define the analyzers). Keep
# app-side index versioning off so IndexVersionManager doesn't also try to create them.
app.elasticsearch.versioning.enabled=false
# app.elasticsearch.host / port / scheme are injected via @DynamicPropertySource.

# ── Kafka: real ─────────────────────────────────────────────────────────────────
# Start the @KafkaListener containers against the real broker (base profile disabled them).
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.auto-offset-reset=earliest
# The base profile set tiny producer timeouts to fail fast against a dead broker;
# give the real broker realistic budgets so publishes succeed under container startup.
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=10000
# spring.kafka.bootstrap-servers is injected via @DynamicPropertySource.
